server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # /api/chat/stream -> http://api:8000/chat/stream
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # server-sent events: don't buffer, flush every token immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
