name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops -d ops"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ops:ops@localhost:5432/ops
      DATABASE_URL: postgresql://ops:ops@localhost:5432/ops
      LLM_PROVIDER: offline
      EMBEDDING_PROVIDER: hashing
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (unit + pgvector integration)
        run: pytest -v
      - name: Ingest sample data and run the eval suite (offline)
        run: |
          python -m ops_assistant.ingest --reset
          python -m evals.run_eval --no-judge

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the whole stack
        # (not --wait: the one-shot `ingest` service exits by design)
        run: docker compose up -d --build
      - name: Smoke test API and UI proxy
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 3; done
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/chat -H 'content-type: application/json' \
            -d '{"question":"Which node had the most OOMKilled containers?"}' | tee /tmp/chat.json
          grep -q node-4 /tmp/chat.json
          curl -fsS http://localhost:3000/api/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
