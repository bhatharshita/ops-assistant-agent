# Whole stack:  docker compose up --build
#   ui  -> http://localhost:3000     api -> http://localhost:8000/docs
# Works with no API keys (offline mode). Put keys in .env to use a real LLM.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro  # creates ops_test for `make test-db`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot job: loads the sample issues + logs, then exits.
  ingest:
    build: ./backend
    command: ["python", "-m", "ops_assistant.ingest"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://ops:ops@db:5432/ops
      DATA_DIR: /data/sample
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://ops:ops@db:5432/ops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
